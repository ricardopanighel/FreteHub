# Blueprint do Render: API e front em um unico servico Docker (ver Dockerfile).
# O banco fica no Neon (Postgres gratuito, sem prazo de expiracao). A connection
# string dele e pedida em DATABASE_URL quando o Blueprint e criado.
services:
  - type: web
    name: fretehub
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
